<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaCart — E-commerce</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f6f7fb;color:#15161a}button,input,select{font:inherit}.top{background:#111827;color:#fff;padding:18px}.bar{max-width:1250px;margin:auto;display:flex;gap:12px;align-items:center}.brand{font-weight:900;font-size:24px}.search{flex:1;padding:13px 16px;border:0;border-radius:14px}.pill,button{border:0;border-radius:12px;padding:11px 14px;cursor:pointer}.pill{background:#ffffff18;color:#fff}.wrap{max-width:1250px;margin:auto;padding:28px}.hero{background:linear-gradient(120deg,#4f46e5,#9333ea);color:#fff;border-radius:30px;padding:50px;margin-bottom:25px;overflow:hidden}.hero h1{font-size:clamp(45px,7vw,90px);margin:0 0 10px;letter-spacing:-.06em}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{background:#fff;border:1px solid #ddd}.filters button.active{background:#111;color:#fff}.layout{display:grid;grid-template-columns:1fr 350px;gap:22px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.product{background:#fff;border:1px solid #e4e6ec;border-radius:22px;overflow:hidden;transition:.25s}.product:hover{transform:translateY(-6px);box-shadow:0 20px 40px #00000010}.pic{height:180px;background:linear-gradient(135deg,#eef2ff,#fdf2f8);display:grid;place-items:center;font-size:64px}.pbody{padding:18px}.price{font-size:22px;font-weight:800}.muted{color:#737782}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.add{background:#111;color:#fff;width:100%;margin-top:12px}.side{background:#fff;border:1px solid #e4e6ec;border-radius:24px;padding:20px;height:max-content;position:sticky;top:15px}.cartitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #eee}.qty button{padding:5px 9px}.coupon{display:flex;gap:7px;margin:15px 0}.coupon input{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px}.checkout{background:#4f46e5;color:#fff;width:100%;font-weight:700}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.box{background:#fff;border-radius:24px;padding:25px;max-width:500px;width:100%}.box input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}.orders{margin-top:20px}@media(max-width:950px){.layout{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.side{position:static}}@media(max-width:600px){.bar{flex-wrap:wrap}.search{order:3;flex-basis:100%}.products{grid-template-columns:1fr}.wrap{padding:18px}}
</style></head><body><header class="top"><div class="bar"><div class="brand">NovaCart</div><input id="search" class="search" placeholder="Search products..."><button class="pill" onclick="showOrders()">Orders</button><button class="pill" onclick="scrollCart()">Cart (<span id="count">0</span>)</button></div></header><main class="wrap"><section class="hero"><div style="opacity:.8">SPRING / DIGITAL STORE</div><h1>Everything you need.<br>Nothing you don't.</h1><p>Search, filter, wishlist, cart and checkout — all working in your browser.</p></section><div class="filters" id="filters"></div><div class="layout"><section><div class="row"><h2>Products</h2><select id="sort"><option value="featured">Featured</option><option value="low">Price: low</option><option value="high">Price: high</option><option value="rating">Rating</option></select></div><div id="products" class="products"></div></section><aside id="cart" class="side"><h2>Your cart</h2><div id="cartItems"></div><div class="coupon"><input id="coupon" placeholder="Coupon code"><button onclick="applyCoupon()">Apply</button></div><div class="row"><span>Subtotal</span><b id="subtotal">$0.00</b></div><div class="row"><span>Discount</span><b id="discount">$0.00</b></div><hr><div class="row"><strong>Total</strong><strong id="total">$0.00</strong></div><button class="checkout" onclick="checkout()">Secure checkout</button><div id="orders" class="orders"></div></aside></div></main><div id="modal" class="modal"><div class="box"><h2>Checkout</h2><p class="muted">Demo checkout — no real payment is processed.</p><input id="buyer" placeholder="Full name"><input id="address" placeholder="Delivery address"><input id="card" placeholder="Card number (demo)"><button class="checkout" onclick="placeOrder()">Place order</button><button style="width:100%;margin-top:8px" onclick="closeModal()">Cancel</button></div></div><script>
const data=[['Aero Headphones','Audio','🎧',79,'Wireless over-ear headphones',4.8],['Orbit Watch','Wearables','⌚',129,'Smart everyday watch',4.7],['Pixel Camera','Tech','📷',299,'Compact creator camera',4.9],['Cloud Keyboard','Tech','⌨️',89,'Low-profile mechanical keyboard',4.6],['Studio Lamp','Home','💡',59,'Adjustable desk light',4.5],['Travel Pack','Lifestyle','🎒',69,'Lightweight everyday backpack',4.7],['Desk Stand','Home','🖥️',45,'Aluminum monitor stand',4.4],['Creator Mic','Audio','🎙️',119,'USB condenser microphone',4.8],['Smart Pen','Lifestyle','🖊️',39,'Digital note-taking pen',4.3]];
let cart=JSON.parse(localStorage.getItem('novacart')||'{}'),wish=new Set(JSON.parse(localStorage.getItem('wish')||'[]')),discountRate=0,cat='All';
const $=id=>document.getElementById(id);function save(){localStorage.setItem('novacart',JSON.stringify(cart));localStorage.setItem('wish',JSON.stringify([...wish]))}function renderFilters(){let cs=['All',...new Set(data.map(x=>x[1]))];$('filters').innerHTML=cs.map(c=>`<button class="${c===cat?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}function render(){renderFilters();let q=$('search').value.toLowerCase();let arr=data.filter(x=>(cat==='All'||x[1]===cat)&&x[0].toLowerCase().includes(q));let s=$('sort').value;if(s==='low')arr.sort((a,b)=>a[3]-b[3]);if(s==='high')arr.sort((a,b)=>b[3]-a[3]);if(s==='rating')arr.sort((a,b)=>b[5]-a[5]);$('products').innerHTML=arr.map(x=>{let id=x[0];return `<article class="product"><div class="pic">${x[2]}</div><div class="pbody"><div class="row"><b>${x[0]}</b><button onclick="toggleWish('${id}')">${wish.has(id)?'♥':'♡'}</button></div><div class="muted">${x[1]} · ★ ${x[5]}</div><p class="muted">${x[4]}</p><div class="row"><span class="price">$${x[3]}</span></div><button class="add" onclick="add('${id}')">Add to cart</button></div></article>`}).join('')||'<p>No products found.</p>';renderCart()}function add(id){cart[id]=(cart[id]||0)+1;save();renderCart()}function remove(id){delete cart[id];save();renderCart()}function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];save();renderCart()}function renderCart(){let items=Object.entries(cart);$('count').textContent=items.reduce((a,[,n])=>a+n,0);$('cartItems').innerHTML=items.length?items.map(([id,n])=>{let x=data.find(p=>p[0]===id);return `<div class="cartitem"><div><b>${id}</b><div class="muted">$${x[3]} × ${n}</div></div><div class="qty"><button onclick="change('${id}',-1)">−</button><button onclick="change('${id}',1)">+</button><button onclick="remove('${id}')">×</button></div></div>`}).join(''):'<p class="muted">Your cart is empty.</p>';let sub=items.reduce((a,[id,n])=>a+data.find(x=>x[0]===id)[3]*n,0),dis=sub*discountRate;$('subtotal').textContent='$'+sub.toFixed(2);$('discount').textContent='-$'+dis.toFixed(2);$('total').textContent='$'+(sub-dis).toFixed(2)}function toggleWish(id){wish.has(id)?wish.delete(id):wish.add(id);save();render()}function applyCoupon(){discountRate=$('coupon').value.trim().toUpperCase()==='EYASIN10'?.1:0;renderCart();alert(discountRate?'10% coupon applied!':'Coupon invalid. Try EYASIN10.')}function scrollCart(){$('cart').scrollIntoView({behavior:'smooth'})}function checkout(){if(!Object.keys(cart).length)return alert('Add something to the cart first.');$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function placeOrder(){if(!$('buyer').value||!$('address').value||!$('card').value)return alert('Complete the demo checkout fields.');let order={id:'NC-'+Date.now().toString().slice(-7),items:cart,total:$('total').textContent,date:new Date().toLocaleString()};let orders=JSON.parse(localStorage.getItem('orders')||'[]');orders.unshift(order);localStorage.setItem('orders',JSON.stringify(orders));cart={};save();discountRate=0;closeModal();renderCart();showOrders()}function showOrders(){let o=JSON.parse(localStorage.getItem('orders')||'[]');$('orders').innerHTML='<h3>Order history</h3>'+(o.length?o.slice(0,5).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${x.id}</b><br><span class="muted">${x.date} · ${x.total}</span></div>`).join(''):'<span class="muted">No orders yet.</span>')}$('search').oninput=render;$('sort').onchange=render;render();showOrders();
</script></body></html>
