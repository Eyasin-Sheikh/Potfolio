<style id="eyasin-premium-gradient-glow">
/* =========================================================
   PREMIUM GRADIENT GLOW CARD HOVER
   ========================================================= */
.card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    border-color .45s ease,
    box-shadow .45s ease,
    background .45s ease;
}

/* soft animated glow behind the card */
.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-2;
  border-radius:inherit;
  background:linear-gradient(
    115deg,
    #ff174f 0%,
    #ff006e 28%,
    #8b5cf6 58%,
    #22d3ee 100%
  );
  background-size:220% 220%;
  opacity:0;
  filter:blur(18px);
  transform:scale(.94);
  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.2,.8,.2,1);
  animation:eyasinGradientMove 4s ease infinite;
}

/* glowing border layer */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(
    120deg,
    rgba(255,23,79,.95),
    rgba(255,0,110,.75),
    rgba(139,92,246,.85),
    rgba(34,211,238,.75)
  );
  background-size:250% 250%;
  opacity:0;
  transition:opacity .45s ease;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:eyasinGradientMove 4s ease infinite;
}

/* hover state */
.card:hover{
  transform:translateY(-9px) scale(1.015);
  border-color:rgba(255,23,79,.45);
  background:
    radial-gradient(
      circle at 12% 15%,
      rgba(255,23,79,.18),
      transparent 42%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(139,92,246,.16),
      transparent 48%
    ),
    linear-gradient(
      135deg,
      rgba(255,23,79,.08),
      rgba(139,92,246,.07),
      rgba(34,211,238,.06)
    );
  box-shadow:
    0 18px 45px rgba(0,0,0,.38),
    0 0 24px rgba(255,23,79,.20),
    0 0 55px rgba(139,92,246,.13);
}

.card:hover::before{
  opacity:.9;
  transform:scale(1.02);
}

.card:hover::after{
  opacity:1;
}

/* subtle shine passing across the card */
.card{
  --shine-x:-120%;
}
.card:hover{
  --shine-x:120%;
}
.card > *{
  position:relative;
  z-index:1;
}
.card:hover > *{
  filter:drop-shadow(0 0 3px rgba(255,255,255,.03));
}

@keyframes eyasinGradientMove{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

/* Disable hover enlargement on touch screens */
@media (hover:none){
  .card:hover{
    transform:none;
  }
}

/* Accessibility */
@media (prefers-reduced-motion:reduce){
  .card,
  .card::before,
  .card::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>

(()=>{const c=document.getElementById('particles');if(!c)return;const x=c.getContext('2d');let W,H,P=[];function size(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);P=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*2+1,p:Math.random()*6.28}))}function loop(){x.clearRect(0,0,W,H);for(const a of P){a.x+=a.vx;a.y+=a.vy;a.p+=.01;if(a.x<0)a.x=W;if(a.x>W)a.x=0;if(a.y<0)a.y=H;if(a.y>H)a.y=0;const al=.05+.09*(.5+.5*Math.sin(a.p));x.fillStyle=`rgba(45,226,230,${al})`;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}requestAnimationFrame(loop)}addEventListener('resize',size);size();loop()})();
(()=>{const s=document.createElement('style');s.textContent='#cursorGlow{position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);background:radial-gradient(circle,#2de2e611,transparent 65%);opacity:0;transition:opacity .3s}#scrollProgress{position:fixed;top:0;left:0;height:3px;width:0;z-index:10001;background:linear-gradient(90deg,#2de2e6,#ff4ecd,#8d6bff);box-shadow:0 0 16px #2de2e6}';document.head.appendChild(s);const g=document.createElement('div');g.id='cursorGlow';const p=document.createElement('div');p.id='scrollProgress';document.body.append(g,p);let tx=innerWidth/2,ty=innerHeight/2,x=tx,y=ty;addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;g.style.opacity=1});function f(){x+=(tx-x)*.12;y+=(ty-y)*.12;g.style.left=x+'px';g.style.top=y+'px';const h=document.documentElement,max=h.scrollHeight-innerHeight;p.style.width=(max?scrollY/max*100:0)+'%';requestAnimationFrame(f)}f();document.querySelectorAll('.project,.card').forEach(el=>{el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),rx=(e.clientY-r.top)/r.height-.5,ry=(e.clientX-r.left)/r.width-.5;el.style.transform=`perspective(900px) rotateX(${-rx*3}deg) rotateY(${ry*3}deg) translateY(-7px)`});el.addEventListener('pointerleave',()=>el.style.transform='')})})();
</script>
<script id="eyasin-motion-engine">
(function(){
 document.body.classList.add('eyasin-ready');
 const c=document.createElement('canvas');c.id='fx-particles';document.body.prepend(c);
 const ctx=c.getContext('2d');let W,H,dpr,pts=[];
 function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
   const count=Math.min(95,Math.max(42,Math.floor(W/15)));
   pts=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.7+.5,a:Math.random()*6.28}));
 }
 function draw(){ctx.clearRect(0,0,W,H);
   for(const p of pts){p.x+=p.vx;p.y+=p.vy;p.a+=.006;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
     ctx.fillStyle='rgba(255,23,79,'+(.05+.10*(.5+.5*Math.sin(p.a)))+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
   }
   for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.hypot(dx,dy);
     if(dist<105){ctx.strokeStyle='rgba(255,23,79,'+(0.035*(1-dist/105))+')';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}
   }
   requestAnimationFrame(draw)
 }
 addEventListener('resize',resize,{passive:true});resize();draw();

 const cursor=document.createElement('div');cursor.id='fx-cursor';
 const progress=document.createElement('div');progress.id='fx-progress';document.body.append(cursor,progress);
 let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;
 addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;cursor.style.opacity='1'},{passive:true});
 addEventListener('pointerleave',()=>cursor.style.opacity='0',{passive:true});
 function cursorLoop(){cx+=(mx-cx)*.11;cy+=(my-cy)*.11;cursor.style.left=cx+'px';cursor.style.top=cy+'px';
   const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?scrollY/max*100:0)+'%';requestAnimationFrame(cursorLoop)}
 cursorLoop();

 const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('ey-visible')}),{threshold:.12});
 document.querySelectorAll('section,article,.card,.project,.work-card,.demo,.app,.hero-grid,.profile-card').forEach((el,i)=>{
   el.classList.add('ey-reveal');el.style.transitionDelay=Math.min(i*35,280)+'ms';observer.observe(el);
 });
 document.querySelectorAll('a,button,.btn,.nav-btn').forEach(el=>{
   el.addEventListener('pointermove',e=>{if(innerWidth<800)return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform='translate('+x*4+'px,'+y*3+'px)'});
   el.addEventListener('pointerleave',()=>el.style.transform='');
 });
 document.querySelectorAll('img').forEach(img=>{img.classList.add('ey-float')});
})();
</script>
