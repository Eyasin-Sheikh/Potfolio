<style id="eyasin-premium-gradient-glow">
/* =========================================================
   PREMIUM GRADIENT GLOW CARD HOVER
   ========================================================= */
.card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    border-color .45s ease,
    box-shadow .45s ease,
    background .45s ease;
}

/* soft animated glow behind the card */
.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-2;
  border-radius:inherit;
  background:linear-gradient(
    115deg,
    #ff174f 0%,
    #ff006e 28%,
    #8b5cf6 58%,
    #22d3ee 100%
  );
  background-size:220% 220%;
  opacity:0;
  filter:blur(18px);
  transform:scale(.94);
  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.2,.8,.2,1);
  animation:eyasinGradientMove 4s ease infinite;
}

/* glowing border layer */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(
    120deg,
    rgba(255,23,79,.95),
    rgba(255,0,110,.75),
    rgba(139,92,246,.85),
    rgba(34,211,238,.75)
  );
  background-size:250% 250%;
  opacity:0;
  transition:opacity .45s ease;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:eyasinGradientMove 4s ease infinite;
}

/* hover state */
.card:hover{
  transform:translateY(-9px) scale(1.015);
  border-color:rgba(255,23,79,.45);
  background:
    radial-gradient(
      circle at 12% 15%,
      rgba(255,23,79,.18),
      transparent 42%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(139,92,246,.16),
      transparent 48%
    ),
    linear-gradient(
      135deg,
      rgba(255,23,79,.08),
      rgba(139,92,246,.07),
      rgba(34,211,238,.06)
    );
  box-shadow:
    0 18px 45px rgba(0,0,0,.38),
    0 0 24px rgba(255,23,79,.20),
    0 0 55px rgba(139,92,246,.13);
}

.card:hover::before{
  opacity:.9;
  transform:scale(1.02);
}

.card:hover::after{
  opacity:1;
}

/* subtle shine passing across the card */
.card{
  --shine-x:-120%;
}
.card:hover{
  --shine-x:120%;
}
.card > *{
  position:relative;
  z-index:1;
}
.card:hover > *{
  filter:drop-shadow(0 0 3px rgba(255,255,255,.03));
}

@keyframes eyasinGradientMove{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

/* Disable hover enlargement on touch screens */
@media (hover:none){
  .card:hover{
    transform:none;
  }
}

/* Accessibility */
@media (prefers-reduced-motion:reduce){
  .card,
  .card::before,
  .card::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
